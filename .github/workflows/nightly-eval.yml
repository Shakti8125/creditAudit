name: Nightly Evaluation

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  privacy-security-stress:
    name: Adversarial privacy & security stress harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run adversarial privacy / multitenancy / security stress tests
        run: |
          python -m pytest -q \
            tests/adversarial_deep_stress_harness.py \
            tests/test_stress_privacy.py \
            tests/test_stress_multitenancy.py \
            tests/test_stress_security_auth.py