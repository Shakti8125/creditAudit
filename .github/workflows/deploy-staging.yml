name: Deploy Staging

on:
  push:
    branches: [develop]

permissions:
  id-token: write
  contents: read

jobs:
  backend:
    name: Build & deploy backend to staging ECS
    runs-on: ubuntu-latest
    environment: staging
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: modelaudit-ai/backend
      ECS_CLUSTER: modelaudit-cluster
      ECS_SERVICE: modelaudit-staging-service
      ECS_TASK_DEFINITION: modelaudit-backend-task
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE_URI:staging-${{ github.sha }}" -t "$IMAGE_URI:staging-latest" -f backend/Dockerfile backend/
          docker push "$IMAGE_URI:staging-${{ github.sha }}"
          docker push "$IMAGE_URI:staging-latest"

      - name: Run Alembic migrations (one-off ECS task)
        env:
          ECS_SUBNET: ${{ secrets.AWS_STAGING_PRIVATE_SUBNET }}
          ECS_SG: ${{ secrets.AWS_STAGING_ECS_SG }}
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$ECS_TASK_DEFINITION" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$ECS_SUBNET],securityGroups=[$ECS_SG],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["alembic","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::Failed to start the migration task"; exit 1
          fi
          echo "Migration task: $TASK_ARN"
          # Block the rollout until the schema is migrated, and fail the deploy if it wasn't.
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[?name==`backend`].exitCode | [0]' --output text)
          echo "Migration exit code: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ]; then
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
              --query 'tasks[0].{stoppedReason: stoppedReason, containers: containers[].{name: name, exitCode: exitCode, reason: reason}}'
            echo "::error::Alembic migration failed; not rolling out the new backend"; exit 1
          fi

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

  frontend:
    name: Deploy frontend to Vercel (preview)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and deploy to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm ci
          npm i -g vercel
          vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"
          vercel build --token "$VERCEL_TOKEN"
          vercel deploy --prebuilt --token "$VERCEL_TOKEN"