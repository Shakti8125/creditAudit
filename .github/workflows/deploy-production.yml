name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  backend:
    name: Build & deploy backend to production ECS
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: modelaudit-ai/backend
      ECS_CLUSTER: modelaudit-cluster
      ECS_SERVICE: modelaudit-prod-service
      ECS_TASK_DEFINITION: modelaudit-backend-task
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE_URI:prod-${{ github.sha }}" -t "$IMAGE_URI:prod-latest" -f backend/Dockerfile backend/
          docker push "$IMAGE_URI:prod-${{ github.sha }}"
          docker push "$IMAGE_URI:prod-latest"

      - name: Run Alembic migrations (one-off ECS task)
        env:
          ECS_SUBNET: ${{ secrets.AWS_PROD_PRIVATE_SUBNET }}
          ECS_SG: ${{ secrets.AWS_PROD_ECS_SG }}
        run: |
          aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$ECS_TASK_DEFINITION" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$ECS_SUBNET],securityGroups=[$ECS_SG],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"backend","command":["alembic","upgrade","head"]}]}'

      - name: Update ECS service (rolling)
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment

  frontend:
    name: Deploy frontend to Vercel (production)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Run from the repo root, not frontend/. The Vercel project already sets
      # rootDirectory=frontend, so running from inside frontend/ resolves it a
      # second time and the build loses its node_modules ("vite: not found").
      # `vercel build` installs dependencies itself, so no separate npm ci.
      - name: Install and deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm i -g vercel
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          vercel build --prod --token "$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
